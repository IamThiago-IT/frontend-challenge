<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title">
  <title>Ritmo Circular</title>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#163462"/>
      <stop offset="1" stop-color="#070d1c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68e7ff"/>
      <stop offset=".5" stop-color="#7b7dff"/>
      <stop offset="1" stop-color="#f26dff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="url(#ring)">
    <circle cx="300" cy="300" r="210" stroke-width="3" opacity=".35"/>
    <circle cx="300" cy="300" r="170" stroke-width="16" stroke-dasharray="50 24"/>
    <circle cx="300" cy="300" r="120" stroke-width="6" opacity=".7"/>
    <circle cx="300" cy="300" r="64" stroke-width="28" opacity=".85"/>
  </g>
  <g fill="#b8eaff">
    <circle cx="300" cy="90" r="9"/>
    <circle cx="510" cy="300" r="6"/>
    <circle cx="300" cy="510" r="11"/>
    <circle cx="90" cy="300" r="7"/>
  </g>
</svg>
